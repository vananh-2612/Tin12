<html>
  <head>

    <title> <b> Đóng góp ý kiến cho thư viện nhà trường </b> </title>

      </label>
      <li><h2><b> Đóng góp ý kiến </b></h2></li>
      <br>
      <label>
        Ý kiến đóng góp: <textarea name = "txtComment" rows= "6" cols= "40"> </textarea> 
      </label>

      <input type="checkbox" name="chkTruyenngan">Truyện ngắn <br>
      <input type="checkbox" name="chkKynang">Kỹ năng <br>

      <input type="checkbox" name="chkTruyentranh">Truyện tranh <br>
      <input type="checkbox" name="chkLichsu">Lịch sử <br>
      <input type="submit" name="cmd" value="Góp ý">
    </form>
  </body>
</html>
